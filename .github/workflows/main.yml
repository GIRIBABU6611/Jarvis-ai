name: Build Jarvis AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q JarvisAI_FINAL_FIXED.zip -d project

      - name: Find project folder
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix Java 17 compatibility
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$PROJECT_DIR/app/build.gradle.kts"
      - name: Fix MainActivity context
        run: |
          sed -i '50s/\bthis\b/this@MainActivity/g' "$PROJECT_DIR/app/src/main/java/com/example/jarvisai/MainActivity.kt"
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
